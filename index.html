<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống điểm danh QR</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      margin: 20px auto;
      max-width: 450px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>📋 HỆ THỐNG ĐIỂM DANH QR</h1>

  <p>Đưa mã QR của các em vào khung quét</p>

  <div id="reader"></div>

  <div id="result">
    ⏳ Đang khởi động hệ thống...
  </div>

  <script>

  const scriptURL =
    "https://script.google.com/macros/s/AKfycbwhNlrCYWt2fHQic-JRqkShfqJjiThKWLbBTle4PWaSfJHdDk53f-LjOh9czuAtWNdk/exec";

  // Các mã đang chờ Google phản hồi
  const dangCho = new Set();

  // Không cho cùng một QR bị nhận liên tục trong vài giây
  const vuaQuet = new Map();

  // Lưu các kết quả gần nhất
  let lichSu = [];

  function hienThi(message) {

    lichSu.unshift(message);

    if (lichSu.length > 8) {
      lichSu = lichSu.slice(0, 8);
    }

    document.getElementById("result").innerHTML =
      lichSu.join("<hr>");
  }


  function onScanSuccess(decodedText) {

    const maQR = String(decodedText || "").trim();

    if (!maQR) return;


    // Nếu mã này đang chờ phản hồi thì không gửi lại
    if (dangCho.has(maQR)) return;


    // Chống camera nhận cùng một mã liên tục
    const lanCuoi = vuaQuet.get(maQR);

    if (lanCuoi && Date.now() - lanCuoi < 3000) {
      return;
    }


    vuaQuet.set(maQR, Date.now());

    dangCho.add(maQR);


    // Báo ngay lập tức - KHÔNG chờ Google
    hienThi(
      "📷 Đã nhận mã: <b>" +
      maQR +
      "</b><br>" +
      "⏳ Đang gửi điểm danh..."
    );


    const callbackName =
      "xuLyDiemDanh_" + Date.now() + "_" +
      Math.random().toString(36).substring(2, 7);


    const script =
      document.createElement("script");


    let daBaoCho = false;


    // Sau 5 giây nếu Google chưa trả,
    // camera vẫn tiếp tục cho quét bé khác
    const timeout = setTimeout(function() {

      if (daBaoCho) return;

      daBaoCho = true;

      hienThi(
        "📡 Mã <b>" +
        maQR +
        "</b> đã được gửi.<br>" +
        "Máy chủ đang phản hồi chậm, chị vẫn có thể quét bé tiếp theo."
      );

    }, 5000);


    window[callbackName] = function(data) {

      clearTimeout(timeout);


      if (data.success) {

        if (data.duplicate) {

          hienThi(
            "⚠️ <b>" + data.name + "</b><br>" +
            "Lớp: " + data.className + "<br>" +
            "Đã điểm danh hôm nay lúc " +
            data.time
          );

        } else {

          hienThi(
            "✅ <b>" + data.name + "</b><br>" +
            "Lớp: " + data.className + "<br>" +
            "Có mặt lúc " +
            data.time
          );

        }

      } else {

        hienThi(
          "❌ " + data.message
        );

      }


      delete window[callbackName];

      dangCho.delete(maQR);

      script.remove();
    };


    // Gửi request điểm danh ở nền
    script.src =
      scriptURL +
      "?code=" +
      encodeURIComponent(maQR) +
      "&callback=" +
      callbackName;


    document.body.appendChild(script);
  }


  function onScanFailure(error) {
    // Không làm gì khi chưa nhận diện được QR
  }


  window.addEventListener("load", function() {

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  });

</script>

</body>
</html>
