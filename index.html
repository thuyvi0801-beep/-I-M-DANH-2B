<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống điểm danh QR</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }

    #result {
      margin: 20px auto;
      max-width: 450px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>📋 HỆ THỐNG ĐIỂM DANH QR</h1>

  <p>Đưa mã QR của các em vào khung quét</p>

  <div id="reader"></div>

  <div id="result">
    ⏳ Đang khởi động hệ thống...
  </div>

  <script>

<script>

  const scriptURL =
    "https://script.google.com/macros/s/AKfycbwhNlrCYWt2fHQic-JRqkShfqJjiThKWLbBTle4PWaSfJHdDk53f-LjOh9czuAtWNdk/exec";

  // Các mã đã gửi lên máy chủ nhưng chưa nhận kết quả
  const dangCho = new Set();

  // Các mã vừa được camera nhận
  const vuaQuet = new Map();

  // Hàng đợi mã QR chờ gửi
  const hangDoi = [];

  // Các yêu cầu đang chạy song song
  const dangGui = new Set();

  // Thời gian gom mã trước khi gửi 1 batch
  const THOI_GIAN_GOM = 800;

  let timerGui = null;

  // Hiển thị trạng thái
  function hienThi(message) {

    document.getElementById("result").innerHTML =
      message;
  }


  // =====================================================
  // NHẬN QR
  // =====================================================

  function onScanSuccess(decodedText) {

    const maQR =
      String(decodedText || "").trim();

    if (!maQR) return;


    // Không nhận lại mã đang chờ xử lý
    if (dangCho.has(maQR)) return;


    // Chống camera đọc cùng QR nhiều lần trong vài giây
    const lanCuoi =
      vuaQuet.get(maQR);

    if (
      lanCuoi &&
      Date.now() - lanCuoi < 3000
    ) {
      return;
    }


    vuaQuet.set(
      maQR,
      Date.now()
    );

    dangCho.add(maQR);

    hangDoi.push(maQR);


    // Báo NGAY cho người điểm danh
    hienThi(
      "✅ Đã nhận mã QR: <b>" +
      maQR +
      "</b><br>" +
      "⏳ Đang cập nhật..."
    );


    // Gom các mã quét trong 0,8 giây
    if (!timerGui) {

      timerGui = setTimeout(
        guiBatch,
        THOI_GIAN_GOM
      );

    }

  }


  // =====================================================
  // GỬI BATCH
  // =====================================================

  function guiBatch() {

    timerGui = null;


    if (hangDoi.length === 0) {
      return;
    }


    // Lấy tối đa 10 mã mỗi lần
    const codes =
      hangDoi.splice(0, 10);


    if (codes.length === 0) {
      return;
    }


    const batchId =
      "batch_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 7);


    dangGui.add(batchId);


    const callbackName =
      "xuLyBatch_" +
      batchId;


    const script =
      document.createElement("script");


    window[callbackName] =
      function(data) {

        try {

          if (
            data &&
            data.success &&
            Array.isArray(data.results)
          ) {

            let html = "";

            data.results.forEach(
              function(item) {

                const ma =
                  item.code || "";

                if (
                  item.success &&
                  item.duplicate
                ) {

                  html +=
                    "⚠️ <b>" +
                    (item.name || ma) +
                    "</b><br>" +
                    "Lớp: " +
                    (item.className || "") +
                    "<br>" +
                    "Đã điểm danh lúc " +
                    (item.time || "") +
                    "<hr>";

                }

                else if (
                  item.success
                ) {

                  html +=
                    "✅ <b>" +
                    (item.name || ma) +
                    "</b><br>" +
                    "Lớp: " +
                    (item.className || "") +
                    "<br>" +
                    "Có mặt lúc " +
                    (item.time || "") +
                    "<hr>";

                }

                else {

                  html +=
                    "❌ " +
                    (item.message || ma) +
                    "<hr>";

                }


                // Cho phép mã này được xử lý lại
                // nếu camera nhận vào một lần khác
                dangCho.delete(ma);
              }
            );


            if (html) {
              hienThi(html);
            }

          }

          else {

            hienThi(
              "⚠️ Máy chủ đã nhận yêu cầu<br>" +
              "Chị có thể tiếp tục quét."
            );

          }

        }

        catch (error) {

          console.error(
            "Lỗi callback:",
            error
          );

        }


        delete window[callbackName];

        dangGui.delete(batchId);

        script.remove();


        // Nếu trong lúc gửi đã quét thêm bé
        // thì gửi batch tiếp theo
        if (hangDoi.length > 0) {

          if (!timerGui) {

            timerGui = setTimeout(
              guiBatch,
              300
            );

          }

        }

      };


    script.src =
      scriptURL +
      "?codes=" +
      encodeURIComponent(
        codes.join(",")
      ) +
      "&callback=" +
      callbackName;


    document.body.appendChild(script);


    // Nếu đang gửi mà đã có thêm mã
    // thì không cần chờ callback
    if (hangDoi.length > 0) {

      if (!timerGui) {

        timerGui = setTimeout(
          guiBatch,
          THOI_GIAN_GOM
        );

      }

    }

  }


  function onScanFailure(error) {
    // Không làm gì khi chưa nhận diện được QR
  }


  // =====================================================
  // KHỞI ĐỘNG CAMERA
  // =====================================================

  window.addEventListener(
    "load",
    function() {

      const scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          false
        );


      scanner.render(
        onScanSuccess,
        onScanFailure
      );


      hienThi(
        "📷 Hệ thống sẵn sàng – Mời quét mã QR"
      );

    }
  );

</script>
</body>
</html>
