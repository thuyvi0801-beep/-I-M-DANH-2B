<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hệ thống điểm danh QR</title>

  <!-- THƯ VIỆN QR -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      margin-top: 8px;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-sizing: border-box;
    }

    #result {
      margin: 20px auto;
      max-width: 450px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    .ok {
      color: #16803c;
    }

    .warning {
      color: #b77900;
    }

    .error {
      color: #c62828;
    }

    .waiting {
      color: #555;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <h1>📋 HỆ THỐNG ĐIỂM DANH QR</h1>

  <p>Đưa mã QR của các em vào khung quét</p>

  <div id="reader"></div>

  <div id="result">
    📷 Đang khởi động máy quét...
  </div>


  <script>

    // =====================================================
    // WEB APP V6
    // =====================================================

    const scriptURL =
      "https://script.google.com/macros/s/AKfycbwhNlrCYWt2fHQic-JRqkShfqJjiThKWLbBTle4PWaSfJHdDk53f-LjOh9czuAtWNdk/exec";


    // =====================================================
    // HÀNG ĐỢI QR
    // =====================================================

    const hangDoi = [];

    // Mã đang chờ Google xử lý
    const dangCho = new Set();

    // Thời điểm camera vừa đọc mã
    const vuaQuet = new Map();

    // Chỉ cho 1 batch gửi tại một thời điểm
    let dangGuiBatch = false;

    // Timer gom các mã quét gần nhau
    let timerBatch = null;

    // Lưu trạng thái hiển thị
    const trangThai = new Map();


    // =====================================================
    // HIỂN THỊ
    // =====================================================

    function capNhatHienThi() {

      const result =
        document.getElementById("result");

      const danhSach =
        Array.from(trangThai.values())
          .slice(-10)
          .reverse();

      if (danhSach.length === 0) {

        result.innerHTML =
          "📷 Mời quét mã QR";

        return;
      }

      result.innerHTML =
        danhSach.join("<hr>");
    }


    function themTrangThai(
      maQR,
      html
    ) {

      trangThai.set(
        maQR,
        html
      );

      capNhatHienThi();
    }


    // =====================================================
    // NHẬN QR
    // =====================================================

    function onScanSuccess(decodedText) {

      const maQR =
        String(decodedText || "").trim();

      if (!maQR) {
        return;
      }


      // Không nhận lại nếu đang chờ xử lý
      if (dangCho.has(maQR)) {
        return;
      }


      // Camera thường đọc cùng một mã nhiều lần
      const lanCuoi =
        vuaQuet.get(maQR);

      if (
        lanCuoi &&
        Date.now() - lanCuoi < 3000
      ) {
        return;
      }


      vuaQuet.set(
        maQR,
        Date.now()
      );


      // Đánh dấu đang chờ
      dangCho.add(maQR);


      // Đưa vào hàng đợi
      hangDoi.push(maQR);


      // Báo ngay lập tức
      themTrangThai(
        maQR,
        "<span class='waiting'>" +
        "📷 Đã nhận mã: <b>" +
        maQR +
        "</b><br>" +
        "⏳ Đang cập nhật..." +
        "</span>"
      );


      // Gom thêm các mã quét gần nhau
      if (!timerBatch) {

        timerBatch =
          setTimeout(
            guiBatch,
            500
          );

      }

    }


    // =====================================================
    // GỬI BATCH
    // =====================================================

    function guiBatch() {

      timerBatch = null;


      // Đang có batch khác chạy
      if (dangGuiBatch) {
        return;
      }


      if (hangDoi.length === 0) {
        return;
      }


      // Chỉ lấy tối đa 10 mã
      const codes =
        hangDoi.splice(0, 10);


      if (codes.length === 0) {
        return;
      }


      dangGuiBatch = true;


      const callbackName =
        "xuLyBatch_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 8);


      const script =
        document.createElement("script");


      let daNhanCallback = false;


      // ===================================================
      // CALLBACK TỪ APPS SCRIPT
      // ===================================================

      window[callbackName] =
        function(data) {

          daNhanCallback = true;


          try {

            if (
              data &&
              data.success &&
              Array.isArray(data.results)
            ) {

              data.results.forEach(
                function(item) {

                  const ma =
                    String(
                      item.code || ""
                    ).trim();


                  // Xóa khỏi danh sách đang chờ
                  dangCho.delete(ma);


                  // -------------------------------
                  // ĐÃ ĐIỂM DANH
                  // -------------------------------

                  if (
                    item.success &&
                    !item.duplicate
                  ) {

                    themTrangThai(
                      ma,
                      "<span class='ok'>" +
                      "✅ <b>" +
                      (item.name || ma) +
                      "</b><br>" +
                      "Lớp: " +
                      (item.className || "") +
                      "<br>" +
                      "Có mặt lúc " +
                      (item.time || "") +
                      "</span>"
                    );

                  }

                  // -------------------------------
                  // ĐÃ ĐIỂM DANH TRƯỚC ĐÓ
                  // -------------------------------

                  else if (
                    item.success &&
                    item.duplicate
                  ) {

                    themTrangThai(
                      ma,
                      "<span class='warning'>" +
                      "⚠️ <b>" +
                      (item.name || ma) +
                      "</b><br>" +
                      "Lớp: " +
                      (item.className || "") +
                      "<br>" +
                      "Đã điểm danh hôm nay lúc " +
                      (item.time || "") +
                      "</span>"
                    );

                  }

                  // -------------------------------
                  // LỖI / KHÔNG TÌM THẤY
                  // -------------------------------

                  else {

                    themTrangThai(
                      ma,
                      "<span class='error'>" +
                      "❌ " +
                      (item.message || ma) +
                      "</span>"
                    );

                  }

                }
              );

            }

            else {

              // Nếu server trả dữ liệu không đúng
              codes.forEach(
                function(ma) {

                  dangCho.delete(ma);

                  themTrangThai(
                    ma,
                    "<span class='error'>" +
                    "⚠️ Máy chủ trả kết quả không hợp lệ" +
                    "</span>"
                  );

                }
              );

            }

          }

          catch (error) {

            console.error(
              "Lỗi xử lý callback:",
              error
            );

            codes.forEach(
              function(ma) {

                dangCho.delete(ma);

                themTrangThai(
                  ma,
                  "<span class='error'>" +
                  "⚠️ Có lỗi khi nhận kết quả" +
                  "</span>"
                );

              }
            );

          }


          // Dọn callback
          delete window[callbackName];

          script.remove();

          dangGuiBatch = false;


          // ==========================================
          // GỬI BATCH TIẾP THEO
          // ==========================================

          if (hangDoi.length > 0) {

            setTimeout(
              guiBatch,
              200
            );

          }

        };


      // =================================================
      // URL BATCH
      // =================================================

      script.src =
        scriptURL +
        "?codes=" +
        encodeURIComponent(
          codes.join(",")
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


      document.body.appendChild(script);


      // Nếu sau khi lấy 10 mã,
      // hàng đợi vẫn còn mã thì sẽ chờ
      // callback batch hiện tại xong rồi gửi tiếp.

    }


    // =====================================================
    // QR KHÔNG NHẬN DẠNG
    // =====================================================

    function onScanFailure(error) {
      // Không làm gì
    }


    // =====================================================
    // KHỞI ĐỘNG CAMERA
    // =====================================================

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        if (
          typeof Html5QrcodeScanner ===
          "undefined"
        ) {

          document.getElementById(
            "result"
          ).innerHTML =
            "<span class='error'>" +
            "❌ Không tải được thư viện quét QR." +
            "</span>";

          return;
        }


        const scanner =
          new Html5QrcodeScanner(
            "reader",
            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              },

              rememberLastUsedCamera: true,

              showTorchButtonIfSupported: true
            },
            false
          );


        scanner.render(
          onScanSuccess,
          onScanFailure
        );


        document.getElementById(
          "result"
        ).innerHTML =
          "<span class='waiting'>" +
          "📷 Mời quét mã QR" +
          "</span>";

      }
    );

  </script>

</body>
</html>
